[package]
name = "vanity_gpg"
version = "0.3.2"
edition = "2021"
authors = ["Kay Lin <i@v2bv.net>"]
description = "A simple tool for generating and filtering vanity GPG keys, c0nCurr3nt1Y"
homepage = "https://github.com/RedL0tus/VanityGPG"
repository = "https://github.com/RedL0tus/VanityGPG"
keywords = [ "GPG", "Vanity", "VanityGPG" ]
readme = "README.md"
license = "MIT"
categories = [ "command-line-utilities" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [ "sequoia" ]
sequoia = [ "sequoia-openpgp" ]
rpgp = [ "pgp", "rand", "chrono", "smallvec", "sha-1" ]

[dev-dependencies]
hex = "^0.4"

[build-dependencies]
cc = "1.2"

[dependencies]
log = { version = "^0.4", features = [ "std" ] }
pgp = { version = "^0.10", optional = true }
clap = { version = "^4.6", features = [ "derive" ] }
rand = { version = "^0.8", optional = true }
rayon = "^1.12"
regex = "^1.13"
sha-1 = { version = "^0.10", features = [ "asm", "compress" ], optional = true }
anyhow = "^1.0"
chrono = { version = "^0.4", optional = true }
nettle = "^7.5"
colored = "^3.1"
mimalloc = { version = "^0.1", default-features = false }
smallvec = { version = "^1.15", optional = true }
backtrace = "^0.3"
byteorder = "^1.5"
indicatif = "^0.18"
thiserror = "^2.0"
sequoia-openpgp = { version = "^1.22", optional = true }

[profile.test]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
